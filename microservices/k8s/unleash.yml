apiVersion: apps/v1
kind: Deployment
metadata:
  name: unleash
  namespace: unleash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unleash
  template:
    metadata:
      labels:
        app: unleash
    spec:
      containers:
        - name: unleash
          image: unleashorg/unleash-server:5
          ports:
            - containerPort: 4242
          env:
            - name: DATABASE_URL
              value: postgres://unleash:unleash@unleash-postgres:5432/unleash
            - name: DATABASE_SSL
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: UNLEASH_ADMIN_USERNAME
              value: admin
            - name: UNLEASH_ADMIN_PASSWORD
              value: unleash4all
            - name: UNLEASH_ADMIN_EMAIL
              value: admin@example.com
---
apiVersion: v1
kind: Service
metadata:
  name: unleash
  namespace: unleash
spec:
  selector:
    app: unleash
  ports:
    - port: 4242
      targetPort: 4242
