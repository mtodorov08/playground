version: '3.9'

services:

  eureka-server:
    container_name: eureka-server
    build: ./eureka-server
    ports:
      - "8761:8761"
#    networks:
#      - micro-net

  api-gateway:
    container_name: api-gateway
    build: ./api-gateway
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
#    networks:
#      - micro-net

  book-service:
    container_name: book-service
    build: ./book-service
    depends_on:
      - eureka-server
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: book-service
      SPRING_RABBITMQ_HOST: rabbitmq
#    networks:
#      - micro-net

  review-service:
    container_name: review-service
    build: ./review-service
    depends_on:
      - eureka-server
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: review-service
      SPRING_RABBITMQ_HOST: rabbitmq
#    networks:
#      - micro-net

#networks:
#  micro-net:
#    driver: bridge


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      
  unleash-postgres:
      image: postgres:16
      environment:
        POSTGRES_DB: unleash
        POSTGRES_USER: unleash
        POSTGRES_PASSWORD: unleash
      ports:
        - "5433:5432"

  unleash:
    image: unleashorg/unleash-server:5
    depends_on:
      - unleash-postgres
    environment:
      DATABASE_URL: postgres://unleash:unleash@unleash-postgres:5432/unleash
      DATABASE_SSL: "false"
    ports:
      - "4242:4242"
